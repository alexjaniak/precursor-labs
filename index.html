<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Precursor Labs is a small research lab building at the edge of design, intelligence, and computation."
    />
    <link rel="canonical" href="https://precursorlabs.org/" />
    <meta name="theme-color" content="#151414" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fffdfa" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://precursorlabs.org/" />
    <meta property="og:site_name" content="Precursor Labs" />
    <meta property="og:title" content="Precursor Labs" />
    <meta property="og:description" content="Building tools to predict, steer, and create the future. Research at the edge of design, intelligence, and computation." />
    <meta property="og:image" content="https://precursorlabs.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Precursor Labs — liquid dot wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@precursorlabs" />
    <meta name="twitter:creator" content="@precursorlabs" />
    <meta name="twitter:title" content="Precursor Labs" />
    <meta name="twitter:description" content="Building tools to predict, steer, and create the future. Research at the edge of design, intelligence, and computation." />
    <meta name="twitter:image" content="https://precursorlabs.org/og-image.png" />
    <meta name="twitter:image:alt" content="Precursor Labs — liquid dot wordmark" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://precursorlabs.org/#organization",
          "name": "Precursor Labs",
          "url": "https://precursorlabs.org",
          "logo": {
            "@type": "ImageObject",
            "url": "https://precursorlabs.org/favicon.svg"
          },
          "description": "Building tools to predict, steer, and create the future. Research at the edge of design, intelligence, and computation.",
          "sameAs": [
            "https://x.com/precursorlabs",
            "https://precursorlabs.substack.com"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://precursorlabs.org/#website",
          "url": "https://precursorlabs.org",
          "name": "Precursor Labs",
          "publisher": { "@id": "https://precursorlabs.org/#organization" }
        }
      ]
    }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Precursor Labs</title>
  </head>
  <body>
    <main class="site-shell">
      <button id="themeToggle" class="theme-toggle" type="button">
        <i aria-hidden="true"></i>
      </button>

      <header class="hero">
        <h1><span>Precursor</span> <span>Labs</span></h1>
        <div class="glider-wrap">
          <canvas id="glider" aria-label="Animated Conway's Game of Life glider logo"></canvas>
        </div>
      </header>

      <section class="about" aria-label="About">
        <h2 class="visually-hidden">About Precursor Labs</h2>
        <p>
          Read our blog
          <a href="https://precursorlabs.substack.com/" rel="noreferrer" target="_blank">here</a>
          and find us on
          <a href="https://x.com/precursorlabs" rel="noreferrer" target="_blank">X</a>.
        </p>
      </section>

    </main>
    <footer class="links">
      <nav aria-label="Precursor Labs links">
        <a
          class="social-link"
          href="https://x.com/precursorlabs"
          rel="noreferrer"
          target="_blank"
          aria-label="X"
        >
          <span class="brand-icon x-icon" aria-hidden="true"></span>
        </a>
        <a
          class="social-link"
          href="https://precursorlabs.substack.com/"
          rel="noreferrer"
          target="_blank"
          aria-label="Blog"
        >
          <span class="brand-icon substack-icon" aria-hidden="true"></span>
        </a>
      </nav>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
