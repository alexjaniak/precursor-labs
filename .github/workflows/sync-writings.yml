name: Sync writings and deploy

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: writings-sync
  cancel-in-progress: false

jobs:
  sync-build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.changes.outputs.any_changed }}
      site_changed: ${{ steps.changes.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync writings
        run: pnpm run sync:writings
        env:
          SUBSTACK_PROXY_BASE: ${{ vars.SUBSTACK_PROXY_BASE }}
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
      - name: Run focused tests
        run: pnpm exec tsx --test tests/writings-sync.test.mjs tests/homepage.test.mjs tests/writings-workflow.test.mjs
      - name: Build site
        run: pnpm run build
        env:
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Validate repository changes
        shell: bash
        run: |
          allowed='^(data/writings\.json|data/writing-sync-state\.json|index\.html)$'
          changed_paths="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | LC_ALL=C sort -u
          )"
          unexpected="$(
            printf '%s\n' "$changed_paths" |
              sed '/^$/d' |
              grep -Ev "$allowed" || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Refusing to continue with unexpected repository changes."
            exit 1
          fi
      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          any_changed=false
          site_changed=false
          if ! git diff --quiet -- data/writings.json data/writing-sync-state.json index.html; then
            any_changed=true
          fi
          if ! git diff --quiet -- index.html; then
            site_changed=true
          fi
          echo "any_changed=$any_changed" >> "$GITHUB_OUTPUT"
          echo "site_changed=$site_changed" >> "$GITHUB_OUTPUT"
      - name: Commit generated changes
        if: steps.changes.outputs.any_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/writings.json data/writing-sync-state.json index.html
          allowed='^(data/writings\.json|data/writing-sync-state\.json|index\.html)$'
          staged_paths="$(git diff --cached --name-only | LC_ALL=C sort -u)"
          unexpected="$(
            printf '%s\n' "$staged_paths" |
              sed '/^$/d' |
              grep -Ev "$allowed" || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit unexpected generated files."
            exit 1
          fi
          git commit -m "chore: sync writings"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Upload Pages artifact
        if: steps.changes.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync-build
    if: needs.sync-build.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
